name: CI

on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python main.py --saida saida_ci --dias-historico 5 --pergunta "quanto economizamos hoje?"
      - run: python -m chargegrid.varredura --n 3 --saida saida_ci/varredura.md
